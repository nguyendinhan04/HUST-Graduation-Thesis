# Basic Airflow cluster configuration for CeleryExecutor with Redis and PostgreSQL.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# AIRFLOW_IMAGE_NAME           - Docker image name used to run Airflow.
#                                Default: apache/airflow:2.8.1
# AIRFLOW_UID                  - User ID in Airflow containers
#                                Default: 50000
# AIRFLOW_PROJ_DIR             - Base path to which all the files will be volumed.
#                                Default: .
# Those configurations are useful mostly in case of standalone testing/running Airflow in test/try-out mode
#
# _AIRFLOW_WWW_USER_USERNAME   - Username for the administrator account (if requested).
#                                Default: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - Password for the administrator account (if requested).
#                                Default: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - Additional PIP requirements to add when starting all containers.
#                                Use this option ONLY for quick checks. Installing requirements at container
#                                startup is done EVERY TIME the service is started.
#                                A better way is to build a custom image or extend the official image
#                                as described in https://airflow.apache.org/docs/docker-stack/build.html.
#                                Default: ''
#
# Feel free to modify this file to suit your needs.
---
x-airflow-common:
  &airflow-common
  # In order to add custom dependencies or upgrade provider packages you can use your extended image.
  # Comment the image line, place your Dockerfile in the directory where you placed the docker-compose.yaml
  # and uncomment the "build" line below, Then run `docker-compose build` to build the images.
  image: ${AIRFLOW_IMAGE_NAME:-nguyendinhan04/extend_airflow:airflow-latest}
  # build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    # AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    PYTHONPATH: /opt
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/plugins:/opt/airflow/plugins
    # - ${AIRFLOW_PROJ_DIR:-.}/sqlite:/opt/sqlite
    # - ${AIRFLOW_PROJ_DIR:-.}/dbt:/opt/airflow/dbt
    # - ${AIRFLOW_PROJ_DIR:-.}/.dbt:/home/airflow/.dbt
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/jars:/opt/airflow/jars

  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    # redis:
    #   condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    expose:
      - "5432"                     # exposes 5432 to other containers on the same network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - airflow

  redis:
    image: redis:latest
    expose:
      - 6379
    ports:
    - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks:
      - airflow

  backend:
    build:
      context: .
      dockerfile: job_matcher_app/Backend/Dockerfile.backend
    image: job-matcher-backend
    container_name: job-matcher-backend
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: job_db_2
      PG_USER: airflow
      PG_PASSWORD: airflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      TFIDF_QUEUE_NAME: profile-tfidf-queue
      SKILL_EXTRACTION_QUEUE_NAME: job-skill-extraction-queue
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ROOTUSER
      MINIO_SECRET_KEY: 1234567890
      MINIO_BUCKET: models
      MINIO_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./job_matcher_app/Backend:/app/src/job_matcher_app/Backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - airflow

  skill-worker:
    build:
      context: .
      dockerfile: job_matcher_app/skill_worker/Dockerfile.skill_worker
    image: skill-worker:latest
    container_name: job-matcher-skill-worker
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      QUEUE_NAME: skill-embedding-queue
      WORKER_NAME: skill_embedding_worker
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: job_db_2
      PG_USER: airflow
      PG_PASSWORD: airflow
    volumes:
      - ./job_matcher_app/skill_worker.py:/app/src/job_matcher_app/skill_worker.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - airflow

  skill-worker-tfidf:
    build:
      context: .
      dockerfile: job_matcher_app/skill_worker/Dockerfile.skill_worker_tfidf
    image: skill-worker-tfidf:latest
    container_name: job-matcher-skill-worker-tfidf
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      QUEUE_NAME: profile-tfidf-queue
      WORKER_NAME: tfidf_worker
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ROOTUSER
      MINIO_SECRET_KEY: 1234567890
      MINIO_BUCKET: models
      MINIO_SECURE: "false"
      TFIDF_MODEL_PREFIX: models/tfidf/
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: job_db_2
      PG_USER: airflow
      PG_PASSWORD: airflow
    volumes:
      - ./job_matcher_app/skill_worker/skill_worker_tfidf.py:/app/src/job_matcher_app/skill_worker_tfidf.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - airflow

  job-skill-extraction-worker:
    build:
      context: .
      dockerfile: job_matcher_app/skill_worker/Dockerfile.skill_extraction_worker
    image: job-skill-extraction-worker:latest
    container_name: job-matcher-skill-extraction-worker
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      QUEUE_NAME: job-skill-extraction-queue
      WORKER_NAME: job_skill_extraction_worker
      SKILL_EXTRACTOR_MODE: ${SKILL_EXTRACTOR_MODE:-ner_skilltrie}
      NER_MODEL_PREFIX: ${NER_MODEL_PREFIX:-models/models/checkpoint-360/}
      SKILL_REPO_SCHEMA: ${SKILL_REPO_SCHEMA:-public}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ROOTUSER
      MINIO_SECRET_KEY: 1234567890
      MINIO_BUCKET: models
      MINIO_SECURE: "false"
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: job_db_2
      PG_USER: airflow
      PG_PASSWORD: airflow
    volumes:
      - ./job_matcher_app/skill_extraction_worker.py:/app/src/job_matcher_app/skill_extraction_worker.py
      - ./job_matcher_app/skill_extraction:/app/src/job_matcher_app/skill_extraction
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - airflow

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow
